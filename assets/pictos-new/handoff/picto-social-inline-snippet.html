<!-- Picto Lien social — Les Roues Solidaires
     Inline SVG à coller directement dans le HTML/JSX (pas en <img src>,
     sinon le survol ne pourra pas déclencher l'animation interne). -->

<style>
  .lrs-picto-social .lrs-shift {
    transform: translate(0, 0);
    transition: transform .32s cubic-bezier(.22,.61,.36,1);
  }
  .lrs-picto-social:hover .lrs-shift {
    transform: translate(9px, 5px);
  }
</style>

<svg class="lrs-picto-social" width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <g class="lrs-shift">
    <circle cx="118" cy="45" r="34" fill="#4a5a8a"/>
    <rect x="84" y="88" width="68" height="95" rx="34" fill="#4a5a8a"/>
  </g>
  <circle cx="82" cy="42" r="34" fill="#7084c1"/>
  <rect x="48" y="85" width="68" height="98" rx="34" fill="#7084c1"/>
</svg>
