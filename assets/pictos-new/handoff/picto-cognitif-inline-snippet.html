<!-- Picto Cognitif — Les Roues Solidaires
     Inline SVG à coller directement dans le HTML/JSX (pas en <img src>,
     sinon le survol ne pourra pas déclencher l'animation interne). -->

<style>
  .lrs-picto-cognitif .lrs-curve { transition: stroke-width .2s ease; }
  .lrs-picto-cognitif:hover .lrs-curve { stroke-width: 9.5; }
  .lrs-picto-cognitif .lrs-bubble {
    opacity: 0; transform: scale(.25); transform-box: fill-box; transform-origin: center;
    transition: opacity .2s ease, transform .2s ease;
  }
  .lrs-picto-cognitif:hover .lrs-bubble {
    opacity: 1; transform: scale(1);
    transition: opacity .18s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
    animation: lrs-picto-bubble-pulse 1.3s ease-in-out infinite;
  }
  .lrs-picto-cognitif:hover .lrs-bubble:nth-of-type(2) { animation-delay: .12s; }
  .lrs-picto-cognitif:hover .lrs-bubble:nth-of-type(3) { animation-delay: .24s; }
  .lrs-picto-cognitif:hover .lrs-bubble:nth-of-type(4) { animation-delay: .36s; }
  @keyframes lrs-picto-bubble-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.45); } }
</style>

<svg class="lrs-picto-cognitif" width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

  <path class="lrs-curve" d="M59,112 C61,128 71,142 85,148" fill="none" stroke="#2E8C6A" stroke-width="7" stroke-linecap="round"/>
  <path class="lrs-curve" d="M117,55 C132,60 139,72 141,88" fill="none" stroke="#2E8C6A" stroke-width="7" stroke-linecap="round"/>
  <path class="lrs-curve" d="M141,112 C139,128 129,142 115,148" fill="none" stroke="#2E8C6A" stroke-width="7" stroke-linecap="round"/>
